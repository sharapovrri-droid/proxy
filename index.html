<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MTProto Auto</title>
</head>

<body>

<iframe
    id="frame"
    src="https://mtproto.ru/personal.php"
    style="position:fixed;top:0;left:0;width:100%;height:100%;border:none;">
</iframe>

<script>

let switched = false;

function checkProxy() {

    try {

        let frame = document.getElementById('frame');
        let doc = frame.contentWindow.document;

        // Ищем tg:// ссылку
        for (let a of doc.links) {

            if (a.href.startsWith('tg://')) {

                window.location.href = a.href;
                return;
            }
        }

        // Если прокси нет
        if (
            !switched &&
            doc.body.innerText.includes('Свободных серверов')
        ) {

            switched = true;

            frame.src =
                'https://mtproto.ru/example-other.php';
        }

    } catch(e) {}

}

setInterval(checkProxy, 1000);

</script>

</body>
</html>
