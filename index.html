<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MTProto Auto</title>
</head>

<body style="margin:0">

<iframe
id="frame"
src="https://mtproto.ru/personal.php"
style="width:100vw;height:100vh;border:none">
</iframe>

<script>

let switched = false;

function tryOpen() {

    try {

        let frame = document.getElementById('frame');
        let doc = frame.contentWindow.document;

        let tg = [...doc.links].find(a =>
            a.href.startsWith('tg://')
        );

        if (tg) {

            tg.click();

            setTimeout(()=>{
                window.location = tg.href;
            },300);

        }

    } catch(e) {}

}

// Проверяем каждую секунду
setInterval(tryOpen, 1000);

// Через 5 сек переключаемся на сторонний
setTimeout(() => {

    if (!switched) {

        switched = true;

        document.getElementById('frame').src =
        'https://mtproto.ru/example-other.php';
    }

}, 5000);

</script>

</body>
</html>
