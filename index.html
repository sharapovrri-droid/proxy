<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MTProto Auto</title>
</head>

<body style="margin:0">

<iframe
id="frame"
style="width:100vw;height:100vh;border:none">
</iframe>

<script>

let switched = false;

// Загружаем основной прокси без кэша
document.getElementById('frame').src =
'https://mtproto.ru/personal.php?t=' + Date.now();

function tryOpen() {

    try {

        let frame = document.getElementById('frame');
        let doc = frame.contentWindow.document;

        // Ищем tg:// ссылку
        let tg = [...doc.links].find(a =>
            a.href.startsWith('tg://')
        );

        if (tg) {

            tg.click();

            setTimeout(()=>{
                window.location = tg.href;
            },300);

        }

    } catch(e) {}

}

// Проверяем каждую секунду
setInterval(tryOpen, 1000);

// Через 6 секунд открываем сторонние прокси
setTimeout(() => {

    if (!switched) {

        switched = true;

        document.getElementById('frame').src =
        'https://mtproto.ru/example-other.php?t=' + Date.now();
    }

}, 6000);

</script>

</body>
</html>
